l_russian:
 rule_oik_special_title_names:0 "Ойкумена: особые и институциональные титулы"
 setting_oik_special_names_interface:0 "Сохранять привычные названия (рекомендуется)"
 setting_oik_special_names_interface_desc:0 "Папство, патриархаты, священные ордены, церемониальные престолы и сходные особые титулы сохраняют привычные русские названия. Обычные владения и географические названия по-прежнему меняются в зависимости от культуры."
 setting_oik_special_names_holder:0 "Использовать культуру владельца"
 setting_oik_special_names_holder_desc:0 "Особые титулы используют культурную форму имени персонажа, который ими владеет. Например, если Папством владеет греческий персонаж, Папство использует греческое название."
 setting_oik_special_names_foreign_rule:0 "Использовать культуру иностранного сюзерена"
 setting_oik_special_names_foreign_rule_desc:0 "Пока особые титулы независимы, они сохраняют привычные названия. Если они становятся вассалами иностранного верховного сюзерена, используется культурная форма этого правителя; например, Папа, ставший вассалом греческого императора, использует греческую форму."
